services:
  postgres:
    image: postgres:17
    container_name: boutique-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: boutique
      POSTGRES_PASSWORD: boutique_dev
      POSTGRES_DB: boutique_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: